<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FARID — Collector Canvas</title>
<script>
  const params = new URLSearchParams(window.location.search);
  const pieces = params.get('pieces') || '';
  
  const ogImage = document.createElement('meta');
  ogImage.setAttribute('property', 'og:image');
  ogImage.setAttribute('content', `https://www.farid.world/api/og?pieces=${pieces}`);
  document.head.appendChild(ogImage);

  window.location.href = "https://www.farid.world/";
</script>
</head>
<body>
</body>
</html>
